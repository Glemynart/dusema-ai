[project]
name = "dusema-ai"
version = "0.1.0"
description = "Enterprise AI workflow automation"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.20.1,<2",
    "fastapi>=0.165.0,<1",
    "psycopg[binary]>=3.3.9,<4",
    "pydantic>=2.14.4,<3",
    "pydantic-settings>=2.16.3,<3",
    "sqlalchemy>=2.1.9,<2.2",
    "uvicorn>=0.54.0,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.2,<3",
    "pytest>=9.2.0,<10",
    "ruff>=0.17.6,<0.18",
]

[build-system]
requires = ["uv_build==0.13.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "dusema"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = ["integration: requires a real, disposable PostgreSQL database"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
