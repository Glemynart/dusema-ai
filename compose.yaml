name: dusema-ai

services:
  postgres:
    image: postgres:18.7-alpine@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
    environment:
      POSTGRES_DB: ${DUSEMA_DATABASE_NAME:-dusema}
      POSTGRES_USER: ${DUSEMA_DATABASE_USER:-dusema}
      POSTGRES_PASSWORD: ${DUSEMA_DATABASE_PASSWORD:?Set DUSEMA_DATABASE_PASSWORD in .env or the environment}
    ports:
      - "127.0.0.1:${DUSEMA_DATABASE_PORT:-55436}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready --quiet --host=127.0.0.1 --username="$${POSTGRES_USER}" --dbname="$${POSTGRES_DB}"']
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

volumes:
  postgres-data:
