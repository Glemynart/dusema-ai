name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.10"
          checksum: bf65ac1a0af10f92c522d91ac096c7c0a39657647b155577e7836c2cbbb4526c
          require-checksums: true
      - run: uv sync --locked
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync pytest
      - name: Start PostgreSQL
        run: |
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          echo "DUSEMA_DATABASE_PASSWORD=$password" >> "$GITHUB_ENV"
          DUSEMA_DATABASE_PASSWORD="$password" docker compose up -d --wait --wait-timeout 60 postgres
      - name: Check migrations on a clean database
        run: |
          uv run --no-sync alembic upgrade head
          uv run --no-sync alembic current --check-heads
          uv run --no-sync alembic check
      - run: uv run --no-sync pytest -m integration
      - name: Remove the job database
        if: always() && env.DUSEMA_DATABASE_PASSWORD != ''
        run: docker compose down --volumes
